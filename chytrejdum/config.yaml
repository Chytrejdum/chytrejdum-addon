# Doplněk „Chytrej dům“ pro stávající instalace domácího systému (bez naší krabičky).
# Plná práva jako na krabičce (doplňky, zálohy, aktualizace, kamery, Zigbee); změny jen na pokyn uživatele,
# rizikové s potvrzením – samo od sebe nastavení systému nemění (agent/chytrejdum_agent/addon.py).
name: Chytrej dům
version: "0.9.4"
slug: chytrejdum
description: Asistent pro správu a ovládání chytré domácnosti. · Smart home assistant for managing and controlling your home.
url: https://www.chytrejdum.cz
image: ghcr.io/chytrejdum/chytrejdum-addon-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# síť počítače: hledání kamer a zařízení multicastem v domácí síti (jako domácí systém sám)
host_network: true
# aplikace domu jen v panelu; naslouchá jen v síti Supervisoru (172.30.32.1), do domácí sítě port nevede.
# Port 0 = přidělí Supervisor: síť počítače je sdílená a pevný port (8099) už může mít jiný doplněk.
ingress: true
ingress_port: 0
panel_icon: mdi:home-heart
panel_title: Chytrej dům
panel_admin: true
# přístup k domácímu systému přes proxy Supervisoru (SUPERVISOR_TOKEN)
homeassistant_api: true
# plná správa přes Supervisor: doplňky, zálohy, aktualizace, počítač, síť, nastavení zabezpečení doplňků
hassio_api: true
hassio_role: admin
auth_api: true
# soubory domácího systému a ostatních doplňků (konfigurace, sdílené soubory, média, zálohy, certifikáty)
map:
  - type: homeassistant_config
    read_only: false
  - type: all_addon_configs
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: false
  - type: ssl
    read_only: false
# USB a sériová zařízení (Zigbee/Thread adaptéry)
usb: true
uart: true
# přístup k MQTT brokeru, pokud je (Zigbee2MQTT, čidla osob z kamer)
services:
  - mqtt:want
options:
  cloud_url: https://cloud.chytrejdum.cz
schema:
  cloud_url: url
